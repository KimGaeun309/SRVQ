dataset: "esd"

path:
  corpus_path: "/mnt/hdd/Datasets/ESD"
  raw_path: "/mnt/hdd/Datasets/ESD"
  preprocessed_path: "/workspace/kge/ICASSP2024_FS2-develop/ICASSP2024_FS2-develop/preprocessed_data/esd"
  mfa_path: "/workspace/kge/ICASSP2024_FS2-develop/ICASSP2024_FS2-develop/preprocessed_data/esd/mfa/aligned_arpa"

preprocessing:
  val_size: 2000
  test_size: 500
  text:
    text_cleaners: ["english_cleaners"]
    language: "en"
  audio:
    sampling_rate: 16000
    max_wav_value: 32768.0
  stft:
    filter_length: 1024
    hop_length: 256
    win_length: 1024
  mel:
    n_mel_channels: 80
    mel_fmin: 0
    mel_fmax: 8000 # please set to 8000 for HiFi-GAN vocoder, set to null for MelGAN vocoder
  pitch:
    feature: "phoneme_level" # support 'phoneme_level' or 'frame_level'
    normalization: True
  energy:
    feature: "phoneme_level" # support 'phoneme_level' or 'frame_level'
    normalization: True
